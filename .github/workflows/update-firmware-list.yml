name: Update Firmware Lists

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build firmware list
        run: node scripts/update-firmware-list.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Mirror into docs/ (the committed build output) so the deploy picks up the
          # fresh lists even when it serves docs/ as-is without running a build.
          cp public/community-firmware.json public/dmc-firmware.json docs/
          git add public/community-firmware.json public/dmc-firmware.json docs/community-firmware.json docs/dmc-firmware.json
          git diff --staged --quiet && echo "No changes." || (
            # No [skip ci]: Cloudflare Pages honours it too and would never deploy
            # the refreshed lists. GITHUB_TOKEN pushes do not re-trigger workflows.
            git commit -m "chore: update firmware lists"
            git push
          )
